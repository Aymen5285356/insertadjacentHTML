<html>
<head>

<style>
table, tr, td, th {
border: solid 2px;
border-collapse: collapse;}
</style>
</head>
<body>
<h1>Exercice sur l’ajout d’élément</h1>
<table id="tb">
<tr>
<th>Nom</th>
<th>Prenom</th>
</tr>
</table>
<button onclick="ajouter()">Ajouter une ligne</button>
</body>
<script>
function ajouter() {

document.getElementById('tb').insertAdjacentHTML("beforeend","<tr><td>"+N1+"</td><td>"+P1+"</td></tr>");
var N1 = prompt("Nom :")
var P1 = prompt("Prenom :");
}
</script>
</html>
